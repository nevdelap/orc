[project]
name = "orc"
version = "0.0.1"
description = "Orchestrate interactive Igor and Rufus Codex sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyte>=0.8.2",
  "rich>=13.0",
  "textual>=1.0.0",
]

[dependency-groups]
dev = [
  "mdformat>=0.7",
  "mypy>=1.16",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
  "integration: exercises the real PTY and process boundary",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
